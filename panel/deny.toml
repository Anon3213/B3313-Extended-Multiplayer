# Dependency policy for the control panel. What it reads from the network, it reads with the
# server's and the bridge's code, which it runs in its own process and which are under the main
# workspace's stricter policy, and, from the user's own router, with igd-next (panel/src/
# port_map.rs). GPUI brings several hundred crates, so this policy accepts more than that one.
[advisories]
yanked = "deny"
# Unmaintained crates deep in GPUI's tree, with no maintained release of GPUI that drops them.
# None has a known vulnerability (cargo audit), and none parses what the panel reads from the
# network: the HTTP client among them is GPUI's own, which the panel never uses. Recheck when
# upgrading GPUI.
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std, through GPUI's HTTP client" },
    { id = "RUSTSEC-2024-0384", reason = "instant, through GPUI" },
    { id = "RUSTSEC-2024-0436", reason = "paste, a compile-time macro" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, through GPUI's async code" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, a compile-time macro" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, through GPUI's HTTP client" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, GPUI's text shaping of local fonts" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, GPUI's reading of installed fonts" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, Linux D-Bus support not built on Windows" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, Linux D-Bus support not built on Windows" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, Linux D-Bus support not built on Windows" },
]

[licenses]
# Permissive licenses only. Unicode-3.0 covers character tables, as in the main workspace.
allow = [
    # This project's own.
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # A build tool GPUI runs only when building for macOS; none of its code ships in the panel.
    { allow = ["MPL-2.0"], crate = "cbindgen" },
    # LLVM's fuzzing runtime, linked only into fuzzing builds of an image codec.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
