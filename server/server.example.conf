# Settings for b3313-server, read with: b3313-server <address:port> --config <this file>
# Every line is optional; a setting left out keeps its default. Values outside the ranges shown stop
# the server.

# Players admitted at once (1-16).
max_players = 16

# Seconds of silence before a player counts as gone (1-60).
player_timeout_seconds = 5

# How far apart two players may be for a hit to count, by their latest positions (50-5000).
max_hit_distance = 500

# Least milliseconds between two hits by one player on another (0-2000).
min_hit_interval_ms = 150

# Movement faster than this, in units per second within one level and area, is logged as unusual
# for the server's owner but still allowed (100-1000000). A generous guess, not a measurement.
flag_speed = 8000

# A move longer than this between two states counts as a jump, as warps and pipes make (100-1000000).
jump_distance = 1000

# Jumps a player may make in a minute; more are logged and not passed on to others (1-10000).
jumps_per_minute = 30

# Packets per second taken from any one address; more are dropped (40-1000). A game in play sends about 60, so under 100 drops some of an ordinary player's.
packets_per_second = 120

# Join attempts per second taken from all new addresses together (1-1000).
joins_per_second = 20

# The session password, which players type to join, or give a bridge run by hand as
# B3313_PASSWORD. Empty lets anyone join; traffic is encrypted either way. It cannot contain #,
# which starts a comment.
password =

# The host's own password: the first player whose bridge gives it is the host, who may appoint
# moderators, pass the role on and end the session from the chat. The control panel makes one up
# for whoever hosts and joins from it; a bridge run by hand gives it as B3313_HOST_PASSWORD.
# Empty, a server run without the panel has no host until its owner names one. At most 64 plain
# characters, and it cannot contain #.
host_password =

# A file of banned IP addresses, one a line, kept up to date as players are banned and unbanned.
# Empty keeps bans only until the server stops, or the control panel that runs it closes.
ban_file =

# The file this server's key is kept in, made the first time the server runs. Players' programs
# know this server by its key, wherever its address moves: keep the file to stay the same server,
# copy it to move the server to another PC, and show it to nobody, as whoever has it can pose as
# this server. Empty keeps it in server.key beside this file.
key_file =
