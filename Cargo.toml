[workspace]
members = ["bridge", "nettools", "protocol", "server"]
# The control panel is a workspace of its own, so GUI dependencies stay out of this lock file and
# its dependency policy: see panel/deny.toml.
exclude = ["panel"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "warn"

# Argon2 is slow by design, and many times slower unoptimized; every test that joins a server
# derives a key, so the crypto crates are optimized even in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
